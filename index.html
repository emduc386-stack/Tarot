<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bói Bài Tarot Online - Giống Boitarot.org</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f8f5ff;color:#222}
.wrap{max-width:480px;margin:auto;background:#fff;min-height:100vh;padding-bottom:80px}
.head{padding:16px;text-align:center;border-bottom:1px solid #eee;font-weight:700;color:#6d28d9}
.step{padding:14px 16px;background:#faf5ff;color:#7c3aed;font-weight:600;font-size:13px}
.card2{margin:12px 16px;border:2px solid #e9d5ff;border-radius:16px;padding:16px;cursor:pointer;display:flex;gap:12px}
.card2.active{border-color:#7c3aed;background:#f5f3ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.topic{border:1px solid #e5e7eb;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:13px;background:#fff}
.topic.active{background:#7c3aed;color:#fff}
.q{padding:10px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
.q:hover{background:#f5f3ff}
.shuf{text-align:center;padding:40px}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px}
.back{aspect-ratio:2/3;background:linear-gradient(135deg,#1e1b4b,#4c1d95);border-radius:10px;display:grid;place-items:center;color:#c4b5fd;font-size:20px;cursor:pointer;border:2px solid transparent}
.back.sel{border-color:#ec4899;transform:translateY(-5px)}
.front{aspect-ratio:2/3;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px;text-align:center}
.front b{font-size:11px;display:block;margin-top:6px}
.res{padding:16px}
.rc{border:1px solid #e9d5ff;border-radius:16px;padding:16px;margin-bottom:12px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#7c3aed;color:#fff;font-weight:700;margin-top:12px}
textarea{width:calc(100% - 32px);margin:12px 16px;padding:12px;border-radius:12px;border:1px solid #ddd;min-height:80px}
</style>
</head>
<body>
<div class="wrap">
<div class="head">🔮 BÓI BÀI TAROT ONLINE</div>
<div id="app"></div>
</div>
<script>
let step=1, method='', topic='', question='', need=3, picks=[];
const topics=["Crush","Người yêu cũ","Người yêu hiện tại","Mập mờ","Người yêu tương lai","Sự nghiệp","Tài chính","Học tập","Sức khỏe"];
const qs={
"Crush":["Crush có để ý đến tôi không?","Crush có đang chú ý người khác không?","Tôi có điểm cộng gì trong mắt crush?","Nếu tôi chủ động, họ phản ứng ra sao?"],
"Người yêu cũ":["Người yêu cũ còn tình cảm với tôi không?","Họ nghĩ gì về việc quay lại?","Lý do thật sự họ rời xa tôi là gì?"],
"Mập mờ":["Người này thật sự có cảm xúc gì với tôi?","Tôi có phải lựa chọn ưu tiên của họ không?","Nếu tôi buông bỏ họ có níu không?"],
"Sự nghiệp":["Công việc 3 tháng tới sẽ thế nào?","Tôi có nên chuyển chỗ làm không?"],
"Tài chính":["Cơ hội tài chính nào đang đến?","Tình hình tài chính 3 tháng tới?"]
};
const tarots=[
{n:"The Fool",vn:"Kẻ Khờ",icon:"🃏",mean:"Khởi đầu mới, hãy liều lĩnh. Vũ trụ đang ủng hộ bạn."},
{n:"The Lovers",vn:"Tình Nhân",icon:"💞",mean:"Lựa chọn từ trái tim. Mối quan hệ đang ở ngã rẽ quan trọng."},
{n:"The Star",vn:"Ngôi Sao",icon:"⭐",mean:"Hy vọng và chữa lành. Điều bạn mong mỏi đang đến gần."},
{n:"The Moon",vn:"Mặt Trăng",icon:"🌙",mean:"Bạn đang overthinking. Đừng tin vào nỗi sợ lúc 2h sáng."},
{n:"The Sun",vn:"Mặt Trời",icon:"☀️",mean:"Hạnh phúc, thành công rực rỡ. Lá may mắn nhất bộ bài!"},
{n:"Death",vn:"Cái Chết",icon:"🦋",mean:"Kết thúc để tái sinh. Phiên bản cũ phải chết đi để bạn mới lớn lên."},
{n:"Wheel",vn:"Vòng Quay",icon:"🎡",mean:"Vận may đổi chiều. Xấu sắp hết, tốt đang tới."},
{n:"Strength",vn:"Sức Mạnh",icon:"🦁",mean:"Sức mạnh mềm. Kiên nhẫn và dịu dàng mới là dũng cảm."}
];

function render(){
let h='';
if(step==1){h=`<div class=step>1/6 Hãy chọn phương thức bói</div>
<div class=card2 onclick="method='cauhoi';step=2;render()"><div>❓</div><div><b>Bói Theo Câu Hỏi</b><br><small>Nhập câu hỏi riêng của bạn</small></div></div>
<div class=card2 onclick="method='chude';step=2;render()"><div>📚</div><div><b>Bói Theo Chủ Đề</b><br><small>Chọn chủ đề có sẵn</small></div></div>`}
if(step==2 && method=='cauhoi'){h=`<div class=step>2/6 Nhập câu hỏi của bạn</div><textarea id=q placeholder="VD: Crush có thích tôi không?"></textarea><button class=btn onclick="question=document.getElementById('q').value;step=3;render()">Tiếp tục</button>`}
if(step==2 && method=='chude'){h=`<div class=step>2/6 Chọn chủ đề</div><div class=grid>${topics.map(t=>`<div class="topic ${topic==t?'active':''}" onclick="topic='${t}';render()">${t}</div>`).join('')}</div>
${topic?`<div class=step>Chọn câu hỏi: ${topic}</div>${(qs[topic]||qs["Crush"]).map(q=>`<div class=q onclick="question='${q}';step=3;render()">${q}</div>`).join('')}`:''}`}
if(step==3){h=`<div class=step>3/6 Chọn kiểu trải bài</div>
<div class=card2 onclick="need=1;step=4;render()"><b>Trải 1 lá</b> - Thông điệp nhanh</div>
<div class=card2 onclick="need=3;step=4;render()"><b>Trải 3 lá</b> - Quá khứ Hiện tại Tương lai</div>`}
if(step==4){h=`<div class=shuf><b>Đang xào bài...</b><br><br>🔮<br><small>Vũ trụ đang kết nối với bạn</small></div>`;setTimeout(()=>{step=5;render()},1500)}
if(step==5){h=`<div class=step>5/6 Chọn ${need} lá bài - Đã chọn ${picks.length}/${need}</div><div class=deck>${tarots.map((c,i)=>`<div class="back ${picks.includes(c)?'sel':''}" onclick="pick(${i})">✦</div>`).join('')}</div>`}
if(step==6){
h=`<div class=step>6/6 Kết quả cho: "${question}"</div><div class=res>${picks.map((c,i)=>`<div class=rc><div style="display:flex;gap:12px"><div style="font-size:40px">${c.icon}</div><div><b>${c.vn}</b> - ${c.n}<br><small>${i==0?'Quá khứ':i==1?'Hiện tại':'Tương lai'}</small></div></div><p style="margin-top:10px;font-size:14px;line-height:1.6">${c.mean}</p></div>`).join('')}
<div class=rc style="background:#f5f3ff"><b>🔮 Tổng hợp chung</b><p style="margin-top:8px;font-size:13px;line-height:1.6">Năng lượng của bạn lúc này là ${picks.map(p=>p.vn).join(', ')}. Vũ trụ nhắn rằng: ${picks[0].mean} Hãy tin vào trực giác, mọi thứ đang diễn ra đúng thời điểm.</p></div>
<button class=btn onclick="location.reload()">🔁 Bói lại</button></div>`}
document.getElementById('app').innerHTML=h;
}
function pick(i){if(picks.length>=need)return;let c=tarots[i];if(picks.includes(c))return;picks.push(c);if(picks.length==need){step=6}else render(); if(step==5)render()}
render();
</script>
</body>
</html>
